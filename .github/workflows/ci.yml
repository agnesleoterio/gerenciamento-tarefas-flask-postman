name: CI - API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit and smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run automated API tests
        run: poetry run python -m unittest discover -s tests -p "test_*.py"

      - name: Run API smoke test
        run: |
          poetry run flask run --host=127.0.0.1 --port=5000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 3
          curl --fail http://127.0.0.1:5000/health
          curl --fail http://127.0.0.1:5000/tasks
          curl --fail \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"email":"ana@example.com","password":"123456"}' \
            http://127.0.0.1:5000/login
